# Local hooks use the project's locked environment; no separate hook downloads.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --frozen black --check
        language: system
        types: [python]
