# Run sequentially; do not make the public endpoint a production backend.
endpoint: https://overpass-api.de/api/interpreter
query_timeout_s: 120
http_timeout_s: 150
attempts: 3
backoff_s: 30
request_pause_s: 5
max_response_bytes: 67108864
output_dir: data/raw/osm_snapshot
csv_path: data/pharmacies/pharmacies_morocco.csv
database_path: data/pharmacies/pharmacies.sqlite3
report_path: docs/data_pharmacies.md
metrics_path: docs/pharmacy_coverage.json
dedupe_distance_m: 10
# Query regions only; never assigned to addr:city as if observed.
city_bboxes:
  Rabat: [33.90, -6.95, 34.10, -6.70]
  Casablanca: [33.40, -7.85, 33.75, -7.35]
  Marrakech: [31.45, -8.20, 31.80, -7.75]
