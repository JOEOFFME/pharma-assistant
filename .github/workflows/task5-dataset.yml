name: Project validation
on:
  push:
    branches: [main, codex/task5-nlu-dataset]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public repository at the triggering commit
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned uv and Python
        run: |
          python3 -m venv /tmp/pharma-task5-bootstrap
          /tmp/pharma-task5-bootstrap/bin/pip install uv==0.13.4
          echo "/tmp/pharma-task5-bootstrap/bin" >> "$GITHUB_PATH"
          /tmp/pharma-task5-bootstrap/bin/uv python install 3.11.17
      - name: Install audio decoding tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install frozen project dependencies
        run: make install
      - name: Verify consumer interface interactions
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          npm test --prefix web
      - name: Rebuild dataset and verify read-only project checks
        run: |
          make schema
          make dataset
          make lint
          make test
      - name: Verify committed data and reports reproduce exactly
        run: git diff --exit-code
      - name: Build runtime container
        run: docker build -f docker/Dockerfile -t pharma-assistant:ci .
      - name: Start container and verify fresh-data runtime
        run: |
          docker run --detach --name pharma-smoke -p 127.0.0.1:8000:8000 pharma-assistant:ci
          trap 'docker logs pharma-smoke; docker rm --force pharma-smoke' EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/health > "$RUNNER_TEMP/pharma_health.json"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            -d '{"text":"wach kayn Doliprane 500 mg?"}' \
            http://127.0.0.1:8000/v1/analyze/text > "$RUNNER_TEMP/pharma_text.json"
          curl --fail --silent --show-error --max-time 30 \
            'http://127.0.0.1:8000/v1/medications/search?q=dolipran&k=1' > "$RUNNER_TEMP/pharma_medications.json"
          curl --fail --silent --show-error --max-time 30 \
            'http://127.0.0.1:8000/v1/pharmacies/nearby?lat=34.0209&lon=-6.8416&k=3' > "$RUNNER_TEMP/pharma_pharmacies.json"
          curl --fail --silent --show-error --max-time 30 \
            'http://127.0.0.1:8000/v1/pharmacies/map?lat=34.0209&lon=-6.8416&radius_km=5' > "$RUNNER_TEMP/pharma_map.json"
          curl --fail --silent --show-error --max-time 30 \
            'http://127.0.0.1:8000/assets/plotly.min.js' > "$RUNNER_TEMP/pharma_plotly.js"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          assert json.loads((root / "pharma_health.json").read_text()) == {"status": "ok"}
          result = json.loads((root / "pharma_text.json").read_text())
          assert result["input"]["raw_text"] == "wach kayn Doliprane 500 mg?"
          assert result["intent"]["label"] == "check_availability"
          assert result["disclaimer"]
          assert json.loads((root / "pharma_medications.json").read_text())["candidates"]
          assert len(json.loads((root / "pharma_pharmacies.json").read_text())["pharmacies"]) == 3
          map_result = json.loads((root / "pharma_map.json").read_text())
          assert map_result["count"] == len(map_result["pharmacies"]) > 0
          assert all(row["distance_km"] <= 5 for row in map_result["pharmacies"])
          assert len(map_result["figure"]["data"][0]["lat"]) == map_result["count"]
          assert (root / "pharma_plotly.js").stat().st_size > 100000
          print("Container health, text, search, directory and Plotly map smoke passed")
          PY
