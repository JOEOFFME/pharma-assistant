[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pharma-assistant"
version = "0.2.0"
description = "Multilingual patient-pharmacy assistance prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "pandas==2.3.3",
  "phonenumbers==9.0.41",
  "plotly==6.3.1",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "pyyaml==6.0.3",
  "rapidfuzz==3.14.6",
  "scikit-learn==1.9.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper==1.2.1",
]
encoder = [
    "torch==2.6.0",
    "transformers==4.49.0",
]

[dependency-groups]
dev = [
  "black==24.10.0",
  "httpx==0.28.1",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
